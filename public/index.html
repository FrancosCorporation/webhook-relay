<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webhook Relay — painel</title>
  <style>
    :root { --fundo:#0f1318; --carta:#1a2027; --borda:#2c3540; --texto:#e8edf2; --suave:#8b98a5; --verde:#2ea043; --vermelho:#f85149; --amarelo:#d29922; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:"Segoe UI",system-ui,Arial,sans-serif; background:var(--fundo); color:var(--texto); padding:20px; }
    h1 { font-size:20px; } .sub { color:var(--suave); font-size:13px; margin-bottom:16px; }
    .metricas { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
    .m { background:var(--carta); border:1px solid var(--borda); border-radius:10px; padding:12px 18px; }
    .m b { font-size:20px; display:block; }
    .m span { color:var(--suave); font-size:12px; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { border:1px solid var(--borda); padding:8px 10px; text-align:left; }
    th { background:var(--carta); color:var(--suave); }
    .badge { padding:2px 10px; border-radius:999px; font-size:11px; font-weight:700; }
    .entregue { background:var(--verde); color:#fff; }
    .pendente { background:var(--amarelo); color:#111; }
    .dlq, .falhou { background:var(--vermelho); color:#fff; }
    button { background:var(--borda); border:none; color:var(--texto); border-radius:6px; padding:6px 12px; font-size:12px; cursor:pointer; }
    button:hover { background:var(--verde); }
  </style>
</head>
<body>
  <h1>🔁 Webhook Relay</h1>
  <p class="sub">fila durável + retry exponencial + DLQ — painel de eventos e entregas</p>
  <div class="metricas" id="metricas"></div>
  <table>
    <thead><tr><th>ID</th><th>Destino</th><th>Status</th><th>Tentativas</th><th>Criado</th><th>Ação</th></tr></thead>
    <tbody id="eventos"></tbody>
  </table>
  <script>
    async function atualizar() {
      const metricas = await fetch('/api/metricas').then((r) => r.json());
      document.getElementById('metricas').innerHTML = `
        <div class="m"><b>${metricas.total}</b><span>eventos</span></div>
        <div class="m"><b>${metricas.entregues}</b><span>entregues</span></div>
        <div class="m"><b>${metricas.pendentes}</b><span>pendentes</span></div>
        <div class="m"><b>${metricas.dlq}</b><span>em DLQ</span></div>
        <div class="m"><b>${metricas.taxaEntrega.toFixed(1)}%</b><span>taxa de entrega</span></div>`;
      const eventos = await fetch('/api/eventos').then((r) => r.json());
      document.getElementById('eventos').innerHTML = eventos.map((e) => `
        <tr>
          <td>${e.id.slice(0, 12)}…</td>
          <td>${e.destino.slice(0, 40)}</td>
          <td><span class="badge ${e.status}">${e.status}</span></td>
          <td>${e.tentativas}</td>
          <td>${e.criado_em}</td>
          <td>${e.status === 'dlq' ? `<button onclick="replay('${e.id}')">replay</button>` : ''}</td>
        </tr>`).join('');
    }
    async function replay(id) {
      await fetch(`/api/replay/${id}`, { method: 'POST' });
      atualizar();
    }
    atualizar();
    setInterval(atualizar, 5000);
  </script>
</body>
</html>
