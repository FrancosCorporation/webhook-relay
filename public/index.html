<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Webhook Relay</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topo">
    <div>
      <p class="sobretitulo">OPERAÇÃO</p>
      <h1>Webhook Relay</h1>
      <p class="subtitulo">Fila durável, entregas e eventos em dead-letter.</p>
    </div>
    <p id="conexao" class="conexao" role="status">Aguardando credencial</p>
  </header>

  <main>
    <section class="acesso" aria-labelledby="acesso-titulo">
      <div>
        <h2 id="acesso-titulo">Acesso administrativo</h2>
        <p>Use o valor de <code>RELAY_SECRET</code>. A credencial fica apenas nesta aba.</p>
      </div>
      <form id="form-acesso">
        <label for="token">Token Bearer</label>
        <div class="linha-acesso">
          <input id="token" name="token" type="password" autocomplete="current-password" required minlength="32">
          <button type="submit">Conectar</button>
          <button id="sair" class="secundario" type="button" hidden>Desconectar</button>
        </div>
        <p id="mensagem" class="mensagem" role="alert" aria-live="polite"></p>
      </form>
    </section>

    <section id="painel" hidden aria-label="Resumo e eventos">
      <div id="metricas" class="metricas" aria-live="polite"></div>
      <section class="eventos" aria-labelledby="eventos-titulo">
        <div class="secao-cabecalho">
          <div>
            <p class="sobretitulo">FILA</p>
            <h2 id="eventos-titulo">Eventos recentes</h2>
          </div>
          <button id="atualizar" class="secundario" type="button">Atualizar</button>
        </div>
        <div class="rolagem-tabela">
          <table>
            <thead>
              <tr><th scope="col">ID</th><th scope="col">Destino</th><th scope="col">Status</th><th scope="col">Tentativas</th><th scope="col">Criado</th><th scope="col">Ação</th></tr>
            </thead>
            <tbody id="eventos-corpo"></tbody>
          </table>
          <p id="vazio" class="vazio" hidden>Nenhum evento na fila.</p>
        </div>
      </section>
    </section>
  </main>
</body>
</html>
